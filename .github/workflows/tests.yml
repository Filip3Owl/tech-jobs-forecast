name: testes

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy scipy scikit-learn statsmodels ruptures requests matplotlib pytest
      - run: pip install -e .
      - run: pytest -q
